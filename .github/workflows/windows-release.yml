name: Release Windows

# Build Windows : produit l'installateur NSIS (.exe) et sa signature de mise à
# jour, à la version du tag, puis les attache à la release de ce tag.
# - push d'un tag v* : build du tag.
# - lancement manuel avec l'entrée `tag` : build de la branche choisie (--ref),
#   publié dans la release de ce tag. Sert à compléter une release existante
#   quand un correctif du workflow ou des scripts est arrivé après le tag.
# - lancement manuel sans `tag` : build seul, sans publication.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release à compléter (ex. v0.6.7). Vide : build sans publication."
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances npm
        run: npm ci

      # Bloque la publication si le proxy ou une clé du projet est hors service :
      # une version livrée avec une recherche morte est pire qu'une version retardée.
      - name: Vérifier le proxy de métadonnées
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 https://sylloge.vercel.app/api/health)"
          echo "$health"
          grep -q '"tmdb":true' <<< "$health"
          grep -q '"igdb":true' <<< "$health"
          curl -fsS --max-time 25 "https://sylloge.vercel.app/api/tmdb/search/movie?query=Inception&language=fr-FR" | grep -q '"id"'
          curl -fsS --max-time 25 -X POST https://sylloge.vercel.app/api/igdb/games \
            -H 'Content-Type: text/plain' --data 'fields name; where id = 1020;' | grep -q '"name"'

      - name: Aligner la version sur le tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag de release invalide : $RELEASE_TAG" >&2
            exit 1
          fi
          SYLLOGE_RELEASE_VERSION="$RELEASE_TAG" node scripts/prepare-tauri-release-version.mjs

      # Le cache Cargo restaure target/ : sans ce nettoyage, l'installeur d'une
      # version précédente reste dans bundle/nsis et part dans la release.
      - name: Nettoyer les bundles Windows mis en cache
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Construire le bundle Windows (NSIS + updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Lister les artefacts produits
        shell: bash
        run: ls -R src-tauri/target/release/bundle

      - name: Attacher les artefacts à la release du tag
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          gh release create "$tag" \
            --title "Sylloge ${tag#v} — Windows" \
            --notes "Installateur Windows (NSIS) et signature de mise à jour." \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/nsis/*.sig || \
          gh release upload "$tag" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/nsis/*.sig --clobber
