name: Release Windows

# Build Windows : produit l'installateur NSIS (.exe) et sa signature de mise à
# jour, à la version du tag, puis les attache à la release de ce tag.
# - push d'un tag v* : build du tag.
# - lancement manuel avec l'entrée `tag` : build de la branche choisie (--ref),
#   publié dans la release de ce tag. Sert à compléter une release existante
#   quand un correctif du workflow ou des scripts est arrivé après le tag.
# - lancement manuel sans `tag` : build seul, sans publication.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release à compléter (ex. v0.6.7). Vide : build sans publication."
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances npm
        run: npm ci

      # Bloque la publication si le proxy ou une clé du projet est hors service :
      # une version livrée avec une recherche morte est pire qu'une version retardée.
      - name: Vérifier le proxy de métadonnées
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 https://sylloge.vercel.app/api/health)"
          echo "$health"
          grep -q '"tmdb":true' <<< "$health"
          grep -q '"igdb":true' <<< "$health"
          curl -fsS --max-time 25 "https://sylloge.vercel.app/api/tmdb/search/movie?query=Inception&language=fr-FR" | grep -q '"id"'
          curl -fsS --max-time 25 -X POST https://sylloge.vercel.app/api/igdb/games \
            -H 'Content-Type: text/plain' --data 'fields name; where id = 1020;' | grep -q '"name"'

      - name: Aligner la version sur le tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag de release invalide : $RELEASE_TAG" >&2
            exit 1
          fi
          SYLLOGE_RELEASE_VERSION="$RELEASE_TAG" node scripts/prepare-tauri-release-version.mjs

      # Le cache Cargo restaure target/ : sans ce nettoyage, l'installeur d'une
      # version précédente reste dans bundle/nsis et part dans la release.
      - name: Nettoyer les bundles Windows mis en cache
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Construire le bundle Windows (NSIS + updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Lister les artefacts produits
        shell: bash
        run: ls -R src-tauri/target/release/bundle

      # La release appartient au workflow macOS : il crée le brouillon, attache les
      # artefacts macOS, publie latest.json puis ouvre la release. Windows ne crée
      # jamais la release et attend qu'elle existe.
      - name: Attendre la release créée par macOS
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          for attempt in $(seq 1 40); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag trouvée."
              exit 0
            fi
            sleep 15
          done
          echo "La release $tag n'existe pas : la publication macOS n'a pas abouti." >&2
          exit 1

      - name: Attacher l’installateur Windows et sa signature
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          shopt -s nullglob
          exe_files=(src-tauri/target/release/bundle/nsis/*.exe)
          sig_files=(src-tauri/target/release/bundle/nsis/*.sig)
          if [[ ${#exe_files[@]} -ne 1 || ${#sig_files[@]} -ne 1 ]]; then
            echo "Les artefacts NSIS attendus sont absents ou ambigus : ${exe_files[*]} ${sig_files[*]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${exe_files[0]}" "${sig_files[0]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Sans cette entrée, tauri-plugin-updater répond TargetNotFound côté Windows :
      # le client ne peut jamais se mettre à jour et l'erreur ressemble à une panne réseau.
      - name: Ajouter Windows au manifeste de mise à jour
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          manifest_dir="$RUNNER_TEMP/manifest"
          mkdir -p "$manifest_dir"

          # Le manifeste est partagé : tant que macOS ne l'a pas publié, le fusionner
          # produirait un manifeste sans entrée darwin et casserait l'autre plateforme.
          downloaded=0
          for attempt in $(seq 1 40); do
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                 --pattern latest.json --dir "$manifest_dir" --clobber 2>/dev/null; then
              downloaded=1
              break
            fi
            sleep 15
          done
          if [[ "$downloaded" -ne 1 || ! -s "$manifest_dir/latest.json" ]]; then
            echo "latest.json n'a pas été publié par macOS : Windows resterait sans mise à jour." >&2
            exit 1
          fi

          shopt -s nullglob
          installer="$(ls src-tauri/target/release/bundle/nsis/*.exe)"
          signature="$(ls src-tauri/target/release/bundle/nsis/*.sig)"
          asset_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$installer")"

          node scripts/merge-tauri-latest-json.mjs \
            --manifest "$manifest_dir/latest.json" \
            --version "$version" \
            --platform windows-x86_64 \
            --url "$asset_url" \
            --signature-file "$signature" \
            --output "$manifest_dir/latest.json"

          gh release upload "$tag" "$manifest_dir/latest.json" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Vérifier le manifeste publié pour les deux plateformes
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          verify_dir="$RUNNER_TEMP/verify"
          mkdir -p "$verify_dir"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir "$verify_dir" --clobber
          node scripts/merge-tauri-latest-json.mjs --check "$verify_dir/latest.json" \
            --version "${tag#v}" \
            --require darwin-aarch64 --require darwin-x86_64 --require windows-x86_64
